<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>雪谷场景预览 · Village War</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d1220; }
      #preview-canvas { display: block; width: 100vw; height: 100vh; }
      #preview-hint {
        position: fixed; left: 12px; bottom: 10px; z-index: 10;
        font: 12px/1.6 "Segoe UI", system-ui, sans-serif; color: rgba(235, 240, 250, 0.75);
        background: rgba(12, 18, 32, 0.55); padding: 6px 10px; border-radius: 6px;
        pointer-events: none; user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="preview-canvas"></canvas>
    <div id="preview-hint">
      拖动旋转 · 滚轮缩放 · 右键拖动平移 · O 自动环绕 · 1 俯视 / 2 玩家视角 / 3 平视山脊 / 4 天际线
    </div>
    <script type="module" src="/src/world-preview.js"></script>
  </body>
</html>
